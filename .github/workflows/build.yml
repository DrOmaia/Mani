name: Build APK

on:
  push:
    branches: [main]
  # Actions → Build APK → Run workflow: build again, mark a version as stable, or go back to the stable version
  workflow_dispatch:
    inputs:
      action:
        description: "build | mark-stable (mark a tested version) | restore-stable (go back to the stable version)"
        type: choice
        options: [build, mark-stable, restore-stable]
        default: build
      version:
        description: "For mark-stable: the version number (e.g. 3). Empty = the latest."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # STABLE holds the tag (vN) of the last version the owner tested and approved
      - name: Mark stable
        if: github.event.inputs.action == 'mark-stable'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          TAG="v${VERSION#v}"
          [ -n "$VERSION" ] || TAG=$(gh release view --json tagName -q .tagName)
          git fetch --tags -f origin
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::No version $TAG"; exit 1; }
          echo "$TAG" > STABLE
          git add STABLE
          git diff --cached --quiet || { git commit -m "Mark $TAG as the stable version [skip ci]"; git push origin HEAD:main; }
          echo "::notice::$TAG is now the stable version"
      - name: Restore stable
        if: github.event.inputs.action == 'restore-stable'
        run: |
          TAG=$(cat STABLE)
          [ "$TAG" != "v0" ] || { echo "::error::No stable version marked yet"; exit 1; }
          git fetch --tags -f origin
          git checkout main
          # only the app itself goes back; the workflow and the key stay
          git rm -r -q www
          git checkout "$TAG" -- www package.json capacitor.config.json
          git diff --cached --quiet || { git commit -m "Restore the stable version $TAG"; git push origin main; }
      - name: Commit to publish
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: github.event.inputs.action != 'mark-stable'
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        if: github.event.inputs.action != 'mark-stable'
        with: { distribution: temurin, java-version: 21 }
      # Kirundi voice (Meta MMS, ONNX build by Francis-Real): copied into the app at build time (no phone download)
      - name: Kirundi voice model
        if: github.event.inputs.action != 'mark-stable'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = "Francis-Real/mms-tts-run-onnx"
          info = json.load(urllib.request.urlopen(f"https://huggingface.co/api/models/{repo}"))
          files = [s["rfilename"] for s in info.get("siblings", [])]
          print("files in repo:", files)
          dest = os.path.join("www/models", repo)
          for f in files:
              if f.startswith(".") or f.endswith((".md", ".gitattributes")):
                  continue
              out = os.path.join(dest, f)
              os.makedirs(os.path.dirname(out), exist_ok=True)
              urllib.request.urlretrieve(f"https://huggingface.co/{repo}/resolve/main/{f}", out)
              print("saved", out, os.path.getsize(out))
          PY
      - name: Build
        if: github.event.inputs.action != 'mark-stable'
        env:
          N: ${{ github.run_number }}
        run: |
          echo "window.MANI_VERSION = $N;" > www/version.js
          npm install
          # Kirundi voice runtime inside the app (no internet needed): transformers.js + the ONNX wasm it asks for
          mkdir -p www/vendor/tfjs www/vendor/ort
          cp node_modules/@huggingface/transformers/dist/transformers.min.js node_modules/@huggingface/transformers/dist/ort-wasm-simd-threaded.jsep.mjs www/vendor/tfjs/
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.mjs node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.wasm www/vendor/ort/
          ls -la www/vendor/tfjs www/vendor/ort
          npx cap add android
          # version = build number, so every build installs over the previous one
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.$N\"/" android/app/build.gradle
          # allow the app to open the installer for its own update
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|&\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />|' android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml
          # open the app from a mani://join/CODE link (invite): add the link to the launcher activity
          python3 - <<'PY'
          import re
          f = "android/app/src/main/AndroidManifest.xml"
          x = open(f).read()
          filt = ('<intent-filter>'
                  '<action android:name="android.intent.action.VIEW"/>'
                  '<category android:name="android.intent.category.DEFAULT"/>'
                  '<category android:name="android.intent.category.BROWSABLE"/>'
                  '<data android:scheme="mani" android:host="join"/>'
                  '</intent-filter>')
          i = x.index('android:name=".MainActivity"')
          j = x.index('</activity>', i)
          x = x[:j] + filt + x[j:]
          open(f, "w").write(x)
          print("join link added")
          PY
          npx cap sync android
          cd android && ./gradlew assembleRelease --no-daemon
      # Signed with release.keystore (kept in the repository: never change it, or installed apps stop updating)
      - name: Sign
        if: github.event.inputs.action != 'mark-stable'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass pass:mani12345 --ks-key-alias mani --out Mani.apk aligned.apk
          "$BT/apksigner" verify Mani.apk
      - name: Publish release
        if: github.event.inputs.action != 'mark-stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          target_commitish: ${{ steps.head.outputs.sha }}
          name: نسخة ${{ github.run_number }}
          files: Mani.apk
          make_latest: true
      # keep only two versions on GitHub: the newest and the stable one (STABLE); delete the rest with their tags
      - name: Remove old versions
        if: github.event.inputs.action != 'mark-stable'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: v${{ github.run_number }}
        run: |
          STABLE=$(cat STABLE)
          gh release list --limit 200 --json tagName -q '.[].tagName' | while read -r T; do
            [ "$T" = "$KEEP" ] || [ "$T" = "$STABLE" ] || gh release delete "$T" --cleanup-tag --yes
          done
