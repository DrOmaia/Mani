<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mani</title>
<style>
  :root { --bg:#f7f4ee; --card:#fffdf9; --ink:#2b2a27; --mut:#6f6a62; --ar:#4f7f76; --rn:#a86a3c; --line:#e4ddd0; --btn:#ece6da; }
  * { box-sizing:border-box; }
  /* keep everything clear of the phone's status bar (top) and navigation bar (bottom) */
  :root { --sat: max(env(safe-area-inset-top, 0px), 28px); --sab: max(env(safe-area-inset-bottom, 0px), 24px);
    --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    padding:var(--sat) var(--sar) var(--sab) var(--sal);
    font-family:system-ui,"Noto Sans Arabic",sans-serif; }
  body { display:flex; flex-direction:column; }
  .half { flex:1; display:flex; flex-direction:column; gap:8px; padding:10px 16px; min-height:0; }
  .rn { transform:rotate(180deg); border-bottom:2px dashed var(--line); }
  body.flat .rn { transform:none; }
  .lbl { font-size:14px; font-weight:700; }
  .ar .lbl { color:var(--ar); } .rn .lbl { color:var(--rn); }
  .out { flex:1; overflow:auto; background:var(--card); border-radius:14px; padding:12px;
    font-size:24px; line-height:1.5; min-height:60px; }
  .out:empty::before { content:attr(data-hint); color:var(--mut); font-size:16px; }
  .back { font-size:14px; color:var(--mut); min-height:1em; }
  .row { display:flex; gap:8px; }
  textarea { flex:1; font:inherit; font-size:18px; border:1px solid var(--line); border-radius:12px;
    padding:10px; resize:none; height:60px; background:var(--card); color:var(--ink); }
  button { border:0; border-radius:12px; font-size:22px; min-width:52px; color:#fff; cursor:pointer; font-family:inherit; }
  .ar button { background:var(--ar); } .rn button { background:var(--rn); }
  button.alt { background:var(--btn) !important; color:var(--ink); }
  button:disabled { opacity:.5; }
  .bar { display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 10px; }
  .bar button { flex:1 1 22%; min-height:48px; background:var(--btn); color:var(--ink); font-size:15px; padding:6px 2px; min-width:0; }
  #upd { display:block; background:var(--ar); color:#fff; text-align:center; padding:10px; font-size:16px; text-decoration:none; }
  #upd[hidden] { display:none; }
  /* panels */
  #panel { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; z-index:5;
    padding:var(--sat) var(--sar) var(--sab) var(--sal); }
  #panel[hidden] { display:none; }
  .ph { display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .ph h2 { flex:1; margin:0; font-size:20px; }
  .ph button { background:var(--btn); color:var(--ink); font-size:16px; padding:8px 12px; }
  .pb { flex:1; overflow:auto; padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
  .item { background:var(--card); border-radius:12px; padding:12px; display:flex; gap:10px; align-items:center; }
  .item .t { flex:1; min-width:0; overflow-wrap:anywhere; }
  .item .rnT { font-size:20px; direction:ltr; text-align:left; }
  .item .arT { font-size:15px; color:var(--mut); }
  .item button { background:var(--btn); color:var(--ink); font-size:16px; min-width:40px; padding:6px; }
  .item.done .t { text-decoration:line-through; opacity:.55; }
  .item button.chk { width:36px; height:36px; min-width:36px; border-radius:50%; border:2px solid var(--rn); background:#fff; font-size:20px; color:var(--rn); padding:0; }
  .phr { cursor:pointer; }
  .pf { display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--line); }
  .pf input { flex:1; min-width:0; font:inherit; font-size:17px; padding:10px; border:1px solid var(--line); border-radius:12px; }
  .pf button { background:var(--ar); padding:0 14px; font-size:16px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .tile { background:var(--card); color:var(--ink); border-radius:16px; padding:14px 6px; display:flex; flex-direction:column; align-items:center; gap:6px; min-height:110px; }
  .tile span { font-size:46px; line-height:1; }
  .tile small { font-size:13px; color:var(--mut); text-align:center; }
  .dl { display:flex; align-items:center; gap:4px; font-size:14px; color:var(--mut); white-space:nowrap; }
  .dl input { width:18px; height:18px; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .chips button { background:var(--rn); font-size:15px; padding:8px 12px; white-space:nowrap; min-width:0; }
  .tile.big span { font-size:56px; }
  .tile.pic { min-height:130px; }
  .tile .rnS { font-size:15px; color:var(--rn); font-weight:700; direction:ltr; }
  .tile .ic svg { width:76px; height:76px; display:block; }
  .tile b { font-size:17px; }
  /* night mode */
  html:has(body.night) { background:#1e2227; }
  body.night { --bg:#1e2227; --card:#2a2f36; --ink:#ece8df; --mut:#a3a9b0; --line:#3b414b; --btn:#3a3f49; }
  body.night .bar button, body.night .ph button, body.night .item button, body.night .set button, body.night button.alt { background:var(--btn) !important; color:var(--ink); }
  /* text size */
  body.fs-s { --fs:0.85; } body.fs-l { --fs:1.25; } body.fs-xl { --fs:1.6; }
  .out { font-size:calc(24px * var(--fs,1)); }
  textarea { font-size:calc(18px * var(--fs,1)); }
  .item .rnT { font-size:calc(20px * var(--fs,1)); }
  .set { display:flex; align-items:center; justify-content:space-between; background:var(--card); border-radius:12px; padding:14px; font-size:18px; }
  .set button { background:var(--btn); color:var(--ink); font-size:16px; padding:8px 12px; min-width:0; }
  .set button.on { background:var(--ar) !important; color:#fff !important; }
  button.set { display:flex; align-items:center; justify-content:space-between; width:100%; background:var(--card); color:var(--ink); font-size:18px; padding:14px; border-radius:12px; min-width:0; }
  button.set.on { outline:3px solid var(--ar); }
  .tabs { display:flex; gap:6px; }
  .tabs button { flex:1; background:var(--btn); color:var(--ink); font-size:15px; padding:9px 4px; min-width:0; }
  .tabs button.on { background:var(--ar) !important; color:#fff !important; }
  .pal { flex-direction:row; justify-content:space-between; }
  .pal i { display:inline-block; width:26px; height:26px; border-radius:50%; margin-inline-start:6px; border:1px solid var(--line); }
  .pal.on { outline:3px solid var(--ar); }
  .msg { background:var(--card); border-radius:12px; padding:14px; font-size:17px; line-height:1.6; }
  .set .lbl2 { color:var(--mut); font-size:14px; }
  /* family: chats, bubbles, ring */
  .fList { display:flex; flex-direction:column; }
  .fRow { display:flex; align-items:center; gap:12px; background:var(--card); padding:12px; border-bottom:1px solid var(--line); cursor:pointer; text-align:start; }
  .fAv { width:48px; height:48px; border-radius:50%; background:var(--ar); color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; flex:none; }
  .fRow .fM { flex:1; min-width:0; }
  .fRow .fN { font-weight:700; font-size:18px; }
  .fRow .fP { color:var(--mut); font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fBadge { background:var(--rn); color:#fff; border-radius:999px; padding:2px 9px; font-size:13px; min-width:24px; text-align:center; }
  .fChat { display:flex; flex-direction:column; gap:8px; padding:10px 12px; }
  .bub { max-width:78%; padding:9px 12px; border-radius:14px; font-size:18px; line-height:1.5; background:var(--card); overflow-wrap:anywhere; box-shadow:0 1px 1px rgba(0,0,0,.06); }
  .bub.me { align-self:flex-end; background:#dcefe9; }
  .bub.ring { border:2px solid var(--rn); }
  .bub small { display:block; color:var(--mut); font-size:12px; margin-top:4px; }
  .fQuick { display:flex; gap:6px; overflow-x:auto; padding:6px 12px 0; }
  .fQuick button { background:var(--btn); color:var(--ink); font-size:15px; padding:8px 12px; white-space:nowrap; min-width:0; }
  .fIn { display:flex; gap:6px; align-items:center; padding:10px 12px; border-top:1px solid var(--line); background:var(--card); }
  .fIn input { flex:1; min-width:0; font:inherit; font-size:17px; padding:10px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); }
  .fIn button { min-width:46px; min-height:46px; padding:0; font-size:20px; }
  .fIn button.rb { background:var(--rn); }
  .fSet { background:var(--card); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; font-size:17px; }
  .fSet input { font:inherit; font-size:17px; padding:10px; border:1px solid var(--line); border-radius:10px; direction:ltr; }
  .fRoles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .fRoles button { background:var(--card); color:var(--ink); font-size:20px; padding:18px 8px; min-height:70px; }
  .fRoles button.on { background:var(--ar) !important; color:#fff !important; }
  #ringOv { position:fixed; inset:0; background:#1b1f1e; color:#fff; display:flex; align-items:center; justify-content:center; z-index:9; padding:24px; }
  #ringOv[hidden] { display:none; }
  .rgBox { text-align:center; width:100%; max-width:420px; }
  .rgBell { font-size:90px; animation:rgShake .6s infinite; }
  @keyframes rgShake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-18deg)} 75%{transform:rotate(18deg)} }
  .rgFrom { font-size:28px; margin:18px 0 28px; font-weight:700; }
  .rgBtns { display:flex; flex-direction:column; gap:12px; }
  .rgBtns button { font-size:22px; padding:18px; border-radius:16px; color:#fff; background:var(--ar); min-height:64px; }
  .rgBtns button.sec { background:#3a4442; }
  .empty { color:var(--mut); text-align:center; padding:30px 0; }
</style>
</head>
<body>
  <a id="upd" hidden dir="rtl" href="https://github.com/DrOmaia/Mani/releases/latest/download/Mani.apk" onclick="update(event)">⬇️ في نسخة جديدة من التطبيق، اضغطي للتحديث</a>

  <!-- Upper half: Kirundi speaker (rotated to face her, unless "flat") -->
  <section class="half rn" dir="ltr">
    <div class="lbl">Ikirundi</div>
    <div class="out" id="outRn" data-hint="Ubusobanuro buzoboneka hano"></div>
    <div class="back" id="backRn"></div>
    <div class="row">
      <textarea id="inRn" placeholder="Andika hano…"></textarea>
      <button id="micSw" class="alt" aria-label="Kiswahili">🎤</button>
      <button id="goRn" aria-label="Sobanura">➜</button>
    </div>
    <div class="chips" id="chipsRn"></div>
  </section>

  <!-- Lower half: Arabic speaker -->
  <section class="half ar" dir="rtl">
    <div class="lbl">العربي</div>
    <div class="out" id="outAr" data-hint="الترجمة بتطلع هون"></div>
    <div class="back" id="backAr"></div>
    <div class="row">
      <textarea id="inAr" placeholder="اكتبي هون…"></textarea>
      <button id="micAr" class="alt" aria-label="تكلّمي">🎤</button>
      <button id="goAr" aria-label="ترجمي">➜</button>
    </div>
  </section>
  <div class="bar" dir="rtl">
    <button data-open="phrases">⭐ جمل</button>
    <button data-open="tasks">✅ المهام</button>
    <button data-open="pics">🧹 أعمال</button>
    <button data-open="quick">💬 ردود</button>
    <button data-open="fam">👨‍👩‍👧 العائلة</button>
    <button data-open="settings">⚙️</button>
    <button data-open="history">🕘 السجل</button>
    <button id="sayAr" aria-label="اقرأ بالبروندي">🔊</button>
    <button id="flip" aria-label="قلب الشاشة">⇅</button>
  </div>

  <div id="ringOv" hidden dir="rtl">
    <div class="rgBox"><div class="rgBell">🔔</div><div id="rgFrom" class="rgFrom"></div>
      <div class="rgBtns" id="rgBtns"></div></div>
  </div>
  <div id="panel" hidden dir="rtl">
    <div class="ph"><h2 id="pTitle"></h2><span id="pTools"></span><button id="pClose">✕</button></div>
    <div class="pb" id="pBody"></div>
    <div class="pf" id="pFoot"></div>
  </div>

<script src="version.js"></script>
<script>
const P = (window.Capacitor && Capacitor.Plugins) || {};
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- storage (every read / write guarded) ----------
function load(k, d) { try { const v = JSON.parse(localStorage.getItem('mani-' + k)); return v == null ? d : v; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem('mani-' + k, JSON.stringify(v)); } catch (e) {} }

const DEFAULT_PHRASES = [
  'صباح الخير', 'كيف حالِك؟', 'شكراً كثير', 'نظّفي المطبخ', 'حضّري الغدا', 'اغسلي الصحون',
  'شغّلي الغسالة', 'انشري الغسيل', 'اكوي الملابس', 'رتّبي غرف النوم', 'امسحي الأرض',
  'نظّفي الحمامات', 'طلّعي الزبالة', 'الأولاد نايمين، بهدوء لو سمحتِ', 'خلّي بالك على الأولاد',
  'شو ناقص من السوق؟', 'ارتاحي شوي', 'هل أكلتِ؟', 'هل إنتِ تعبانة؟', 'بكرا إجازتِك'
];
let phrases = load('phrases', DEFAULT_PHRASES.map(ar => ({ ar, rn: '' })));
// one-time: switch the saved ready phrases to feminine address (the maid is a woman)
const FEM = { 'كيف حالك؟': 'كيف حالِك؟', 'بكرا إجازتك': 'بكرا إجازتِك' };
if (load('fem', 0) < 1) {
  phrases.forEach(p => { if (FEM[p.ar]) { p.ar = FEM[p.ar]; p.rn = ''; } });
  save('phrases', phrases); save('fem', 1);
}
let history = load('history', []);        // [{from:'ar'|'rn'|'sw', src, dst, at}] — kept forever
let tasks = load('tasks', []);            // [{ar, rn, done, daily}]
// daily tasks start unticked each new day
(function () {
  const today = new Date().toDateString();
  if (load('day', '') !== today) {
    tasks.forEach(t => { if (t.daily) t.done = false; });
    save('tasks', tasks); save('day', today);
  }
})();
// quick replies: maid side (Kirundi, tapped on the top half) and Arabic side (her tiles)
const CHIPS_RN = [['Yego', 'نعم'], ['Oya', 'لا'], ['Murakoze', 'شكراً'], ['Ntabwo numvise', 'ما فهمت'],
  ['Ndarwaye', 'أنا تعبانة'], ['Ndashonje', 'أنا جوعانة'], ['Ndakeneye ubufasha', 'أحتاج مساعدة']];
const QR_AR = [
  ['💬', 'نعم؟ شو بدك؟'], ['🤒', 'هل إنتِ تعبانة؟'], ['🍽️', 'هل إنتِ جوعانة؟'], ['📍', 'وين الموضوع؟'],
  ['🐢', 'عيدي الكلام ببطء لو سمحتِ'], ['🙏', 'شكراً كثير'], ['🚨', 'خطر! اطلبي المساعدة فوراً']
];
const ICONS = ["<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"10\" y=\"20\" width=\"44\" height=\"28\" rx=\"6\" fill=\"#facc15\" stroke=\"#0f766e\" stroke-width=\"3\"/><rect x=\"10\" y=\"20\" width=\"44\" height=\"8\" rx=\"4\" fill=\"#0f766e\"/><circle cx=\"22\" cy=\"36\" r=\"2.5\" fill=\"#0f766e\"/><circle cx=\"34\" cy=\"40\" r=\"2.5\" fill=\"#0f766e\"/><circle cx=\"44\" cy=\"34\" r=\"2.5\" fill=\"#0f766e\"/></svg>", "<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"30\" cy=\"34\" r=\"20\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"3\"/><circle cx=\"30\" cy=\"34\" r=\"12\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"2\"/><path d=\"M54 8v52M50 8v14a4 4 0 0 0 8 0V8\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>", "<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"8\" y=\"6\" width=\"48\" height=\"52\" rx=\"6\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"3\"/><rect x=\"8\" y=\"6\" width=\"48\" height=\"12\" rx=\"4\" fill=\"#0f766e\"/><circle cx=\"32\" cy=\"38\" r=\"12\" fill=\"#bae6fd\" stroke=\"#0f766e\" stroke-width=\"3\"/><circle cx=\"16\" cy=\"13\" r=\"2\" fill=\"#fff\"/></svg>", "<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4 12h56\" stroke=\"#0f766e\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M14 12v4M50 12v4\" stroke=\"#0f766e\" stroke-width=\"2\"/><path d=\"M20 16l-6 4 3 8 4-2v22h18V26l4 2 3-8-6-4c-2 3-6 4-9 4s-7-1-9-4z\" fill=\"#fff\" stroke=\"#b45309\" stroke-width=\"3\" stroke-linejoin=\"round\"/></svg>", "<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M40 4L24 36\" stroke=\"#b45309\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M14 36h28l4 16H10z\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"3\" stroke-linejoin=\"round\"/><path d=\"M18 44v6M24 44v6M30 44v6M36 44v6\" stroke=\"#0f766e\" stroke-width=\"2\"/><path d=\"M6 58h52\" stroke=\"#94a3b8\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>", "<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"16\" y=\"6\" width=\"32\" height=\"18\" rx=\"4\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"3\"/><path d=\"M10 28h44v10c0 10-6 16-22 16S10 48 10 38z\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"3\"/><ellipse cx=\"32\" cy=\"30\" rx=\"20\" ry=\"5\" fill=\"#bae6fd\" stroke=\"#0f766e\" stroke-width=\"2\"/></svg>", "<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"10\" y=\"20\" width=\"44\" height=\"6\" rx=\"3\" fill=\"#0f766e\"/><path d=\"M14 26l4 32h28l4-32z\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"3\" stroke-linejoin=\"round\"/><path d=\"M24 32v22M32 32v22M40 32v22\" stroke=\"#0f766e\" stroke-width=\"2\"/><path d=\"M24 14h16\" stroke=\"#b45309\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>", "<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M10 30h44v14c0 8-6 12-22 12S10 52 10 44z\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"3\" stroke-linejoin=\"round\"/><rect x=\"6\" y=\"26\" width=\"52\" height=\"5\" rx=\"2.5\" fill=\"#0f766e\"/><path d=\"M22 18c-3-4 3-6 0-10M32 18c-3-4 3-6 0-10M42 18c-3-4 3-6 0-10\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>", "<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M6 44c0-10 8-16 22-16h10c10 0 20 4 20 14v4H6z\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"3\" stroke-linejoin=\"round\"/><rect x=\"6\" y=\"46\" width=\"52\" height=\"6\" rx=\"3\" fill=\"#0f766e\"/><path d=\"M20 12c-3 3 3 5 0 9M32 10c-3 3 3 5 0 9\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>", "<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"6\" y=\"28\" width=\"52\" height=\"20\" rx=\"3\" fill=\"#fff\" stroke=\"#0f766e\" stroke-width=\"3\"/><rect x=\"6\" y=\"14\" width=\"6\" height=\"34\" rx=\"2\" fill=\"#0f766e\"/><rect x=\"14\" y=\"20\" width=\"16\" height=\"10\" rx=\"4\" fill=\"#bae6fd\" stroke=\"#0f766e\" stroke-width=\"2\"/><path d=\"M34 34h22v6H34z\" fill=\"#b45309\" opacity=\".6\"/><path d=\"M6 52v4M58 52v4\" stroke=\"#0f766e\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>", "<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4 10h10l8 32h26l6-22H18\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M18 22h38l-6 14H22z\" fill=\"#fef3c7\" stroke=\"#b45309\" stroke-width=\"3\" stroke-linejoin=\"round\"/><circle cx=\"24\" cy=\"52\" r=\"4\" fill=\"#0f766e\"/><circle cx=\"48\" cy=\"52\" r=\"4\" fill=\"#0f766e\"/></svg>", "<svg viewBox=\"0 0 64 64\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M36 6a20 20 0 1 0 22 26A16 16 0 0 1 36 6z\" fill=\"#fde68a\" stroke=\"#b45309\" stroke-width=\"3\" stroke-linejoin=\"round\"/><path d=\"M8 52h12l-12 10h12\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"3\" stroke-linejoin=\"round\"/><path d=\"M26 40h8l-8 8h8\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/></svg>"];
// picture tiles for the maid: emoji + Arabic text (she sees the Kirundi on top)
// [emoji (unused now), Arabic, Kirundi]  — Kirundi written by the app's author: have the maid check them

// ---------- translation ----------
async function translate(text, from, to) {
  const k = from + '>' + to + '|' + text;
  if (cache[k]) return cache[k];
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&dt=t'
    + '&sl=' + from + '&tl=' + to + '&q=' + encodeURIComponent(text);
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  const res = j[0].map(p => p[0]).join('');
  cache[k] = res; save('cache', cache);
  return res;
}

let arVoice = null;
// find a female Arabic voice on the phone (voice names say "female" on most Android TTS engines)
async function pickVoice() {
  if (arVoice !== null || !P.TextToSpeech) return;
  try {
    const { voices } = await P.TextToSpeech.getSupportedVoices();
    const ar = voices.map((v, i) => ({ v, i })).filter(x => /^ar/i.test(x.v.lang));
    const fem = ar.find(x => /female|woman|fem/i.test(x.v.name || ''));
    arVoice = fem ? fem.i : (ar[0] ? ar[0].i : -1);
  } catch (e) { arVoice = -1; }
}
// Kirundi voice, in order: (1) the phone has a Kirundi voice; (2) the built-in Meta MMS Kirundi voice
// (inside the APK, works offline, no download); (3) Swahili voice; (4) say so once.
const KRN_LIB = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1';
const KRN_MODEL = 'Francis-Real/mms-tts-run-onnx';   // Meta MMS, Kirundi ("run"); the files are inside the app (added at build time)
let krnTts = null, krnCtx = null, rnSw = null, noRnNoted = false;
async function speakKrnModel(text) {
  if (!krnTts) {
    const lib = await import(KRN_LIB);
    lib.env.allowRemoteModels = false;      // never download: the voice is inside the APK
    lib.env.localModelPath = 'models/';
    krnTts = await lib.pipeline('text-to-speech', KRN_MODEL, { dtype: 'q8' });
  }
  const out = await krnTts(text);
  krnCtx = krnCtx || new (window.AudioContext || window.webkitAudioContext)();
  const buf = krnCtx.createBuffer(1, out.audio.length, out.sampling_rate);
  buf.copyToChannel(out.audio, 0);
  const src = krnCtx.createBufferSource(); src.buffer = buf; src.connect(krnCtx.destination); src.start();
}
async function speakRn(text) {
  if (!text) return;
  try {
    if (P.TextToSpeech && (await P.TextToSpeech.isLanguageSupported({ lang: 'rn' })).supported) {
      return await P.TextToSpeech.speak({ text, lang: 'rn', rate: 0.85 });
    }
  } catch (e) {}
  try { await speakKrnModel(text); return; } catch (e) {}
  try {
    if (rnSw === null && P.TextToSpeech) rnSw = (await P.TextToSpeech.isLanguageSupported({ lang: 'sw' })).supported;
    if (rnSw) return await P.TextToSpeech.speak({ text, lang: 'sw-TZ', rate: 0.85 });
  } catch (e) {}
  if (!noRnNoted) { noRnNoted = true; $('backAr').textContent = 'ما قدرت أقرأ البروندي بالصوت على هالتلفون الآن.'; }
}
async function speakAr(text) {
  if (!text) return;
  try {
    if (P.TextToSpeech) { await pickVoice(); await P.TextToSpeech.speak({ text, lang: 'ar-SA', rate: 0.9, ...(arVoice >= 0 ? { voice: arVoice } : {}) }); }
    else speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(text), { lang: 'ar-SA' }));
  } catch (e) {}
}

let busy = false;
// from: 'ar' (she wrote / spoke Arabic) · 'rn' (maid wrote Kirundi) · 'sw' (maid spoke Swahili)
async function go(from, given) {
  const isAr = from === 'ar';
  const inp = $(isAr ? 'inAr' : 'inRn');
  const text = (given || inp.value).trim();
  if (!text || busy) return;
  busy = true; $('goAr').disabled = $('goRn').disabled = true;
  const own = $(isAr ? 'outAr' : 'outRn'), other = $(isAr ? 'outRn' : 'outAr');
  const back = $(isAr ? 'backAr' : 'backRn');
  const to = isAr ? 'rn' : 'ar';
  try {
    const res = await translate(text, from, to);
    own.textContent = text; other.textContent = res;
    $('backAr').textContent = $('backRn').textContent = '';
    if (!given) inp.value = '';   // only clear the box when its own text was sent
    history.push({ from, src: text, dst: res, at: Date.now() }); save('history', history);
    if (!isAr) speakAr(res); else speakRn(res);   // auto: maid hears Arabic, she hears Kirundi
    // back-translation: how the other side will understand it
    try { back.textContent = (isAr ? '↩︎ يعني: ' : '↩︎ ') + await translate(res, to, from); } catch (e) {}
  } catch (e) {
    const httpErr = /^\d+$/.test(String(e.message));   // the translation service answered with an error
    own.textContent = httpErr
      ? (isAr ? '⚠️ خدمة الترجمة مشغولة الآن، جرّبي بعد شوي.' : '⚠️ Serivisi yo guhindura irarushye. Subira nyuma.')
      : (isAr ? '⚠️ ما في إنترنت، جرّبي لما يرجع الإنترنت.' : '⚠️ Nta interineti. Subira igihe umurongo ugarutse.');
  }
  busy = false; $('goAr').disabled = $('goRn').disabled = false;
}

async function listen(lang, cb) {
  const SR = P.SpeechRecognition;
  try {
    if (SR) {
      const perm = await SR.requestPermissions();
      if (perm.speechRecognition !== 'granted') return;
      const r = await SR.start({ language: lang, maxResults: 1, partialResults: false, popup: true });
      if (r && r.matches && r.matches[0]) cb(r.matches[0]);
    } else if (window.webkitSpeechRecognition) {
      const rec = new webkitSpeechRecognition(); rec.lang = lang;
      rec.onresult = e => cb(e.results[0][0].transcript);
      rec.start();
    }
  } catch (e) {}
}

// translations that failed earlier (no internet) are retried when a list is opened
async function fillMissing() {
  let changed = false;
  for (const x of [...phrases, ...tasks]) {
    if (!x.rn) { try { x.rn = await translate(x.ar, 'ar', 'rn'); changed = true; } catch (e) {} }
  }
  if (changed) { save('phrases', phrases); save('tasks', tasks); render(); }
}
async function addPhrase() {
  const ar = $('newPhr').value.trim(); if (!ar) return;
  const p = { ar, rn: '' };
  phrases.push(p); save('phrases', phrases); render();
  try { p.rn = await translate(ar, 'ar', 'rn'); save('phrases', phrases); render(); } catch (e) {}
}
async function addTask() {
  const ar = $('newTask').value.trim(); if (!ar) return;
  const t = { ar, rn: '', done: false, daily: !!($('newDaily') && $('newDaily').checked) };
  tasks.push(t); save('tasks', tasks); render();
  try { t.rn = await translate(ar, 'ar', 'rn'); save('tasks', tasks); render(); } catch (e) {}
}
async function sayPhrase(i) {
  const p = phrases[i]; closePanel();
  await go('ar', p.ar);
  const rn = cache['ar>rn|' + p.ar];
  if (rn && !p.rn) { p.rn = rn; save('phrases', phrases); }
}

  if (d.open) return openPanel(d.open);
  if (d.stab) { setTab = d.stab; return render(); }
  if (d.pal) { applyPalette(d.pal); return render(); }
  if (d.act === 'checkUpd') return checkUpd();

  if (d.set === 'night') { const on = document.body.classList.toggle('night'); save('night', on); return render(); }
  if (d.fs) { ['s', 'm', 'l', 'xl'].forEach(k => document.body.classList.remove('fs-' + k)); document.body.classList.add('fs-' + d.fs); save('fs', d.fs); return render(); }

// one A4 page = one canvas (150 dpi); Arabic shaping is done by the browser
function pages() {
  const W = 1240, H = 1754, M = 90, out = [];
  let c, g, y;
  const page = () => {
    c = document.createElement('canvas'); c.width = W; c.height = H; g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.fillStyle = '#2b2a27'; y = M; out.push(c);
  };
  const wrap = (text, font, max) => {
    g.font = font; const words = String(text).split(' '), lines = []; let l = '';
    for (const w of words) { const t = l ? l + ' ' + w : w; if (g.measureText(t).width > max && l) { lines.push(l); l = w; } else l = t; }
    if (l) lines.push(l); return lines;
  };
  page();
  g.direction = 'rtl'; g.textAlign = 'right'; g.font = 'bold 54px sans-serif';
  g.fillText('المهام · Ibikorwa', W - M, y + 50);
  g.font = '34px sans-serif'; g.fillStyle = '#6b6b6b'; g.fillText(today(), W - M, y + 110); g.fillStyle = '#1d1d1d';
  y += 170;
  for (const t of tasks) {
    const rn = wrap(t.rn || '', '44px sans-serif', W - 2 * M - 90);
    const ar = wrap(t.ar, '32px sans-serif', W - 2 * M - 90);
    const h = rn.length * 58 + ar.length * 44 + 40;
    if (y + h > H - M) page();
    g.lineWidth = 4; g.strokeStyle = '#b45309'; g.strokeRect(M, y + 8, 50, 50);
    if (t.done) { g.direction = 'ltr'; g.textAlign = 'left'; g.font = 'bold 44px sans-serif'; g.fillStyle = '#b45309'; g.fillText('✓', M + 8, y + 50); g.fillStyle = '#1d1d1d'; }
    g.direction = 'ltr'; g.textAlign = 'left'; g.font = '44px sans-serif';
    rn.forEach(l => { y += 58; g.fillText(l, M + 90, y); });
    g.direction = 'rtl'; g.textAlign = 'right'; g.font = '32px sans-serif'; g.fillStyle = '#6b6b6b';
    ar.forEach(l => { y += 44; g.fillText(l, W - M, y); });
    g.fillStyle = '#2b2a27'; y += 22;
    g.strokeStyle = '#e4ddd0'; g.lineWidth = 2; g.beginPath(); g.moveTo(M, y); g.lineTo(W - M, y); g.stroke(); y += 18;
  }
  return out;
}

// minimal PDF: each page is one JPEG image (no library needed)
function pdfBase64(canvases) {
  const enc = s => Array.from(s, ch => ch.charCodeAt(0) & 255);
  const parts = [], offs = []; let len = 0;
  const add = a => { parts.push(a); len += a.length; };
  const obj = (n, head, stream) => {
    offs[n] = len;
    add(enc(n + ' 0 obj\n' + head + (stream ? '\nstream\n' : '\nendobj\n')));
    if (stream) { add(stream); add(enc('\nendstream\nendobj\n')); }
  };
  add(enc('%PDF-1.4\n'));
  const n = canvases.length, kids = [];
  for (let i = 0; i < n; i++) kids.push((3 + i * 3) + ' 0 R');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Count ' + n + ' /Kids [' + kids.join(' ') + '] >>');
  canvases.forEach((c, i) => {
    const p = 3 + i * 3;
    const jpg = enc(atob(c.toDataURL('image/jpeg', 0.85).split(',')[1]));
    const draw = enc('q 595 0 0 842 0 0 cm /Im0 Do Q');
    obj(p, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ' + (p + 1) + ' 0 R >> >> /Contents ' + (p + 2) + ' 0 R >>');
    obj(p + 1, '<< /Type /XObject /Subtype /Image /Width ' + c.width + ' /Height ' + c.height + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>', jpg);
    obj(p + 2, '<< /Length ' + draw.length + ' >>', draw);
  });
  const count = 3 + n * 3, xref = len;
  let x = 'xref\n0 ' + count + '\n0000000000 65535 f \n';
  for (let i = 1; i < count; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  add(enc(x + 'trailer\n<< /Size ' + count + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF'));
  const all = new Uint8Array(len); let o = 0; parts.forEach(a => { all.set(a, o); o += a.length; });
  let bin = ''; for (let i = 0; i < all.length; i += 8192) bin += String.fromCharCode.apply(null, all.subarray(i, i + 8192));
  return btoa(bin);
}

async function sharePdf() {
  const b64 = pdfBase64(pages());
  try {
    if (P.Filesystem && P.Share) {
      const f = await P.Filesystem.writeFile({ path: 'Mani-tasks.pdf', data: b64, directory: 'CACHE' });
      await P.Share.share({ title: 'Mani-tasks.pdf', files: [f.uri] });
    } else {
      const a = document.createElement('a'); a.href = 'data:application/pdf;base64,' + b64; a.download = 'Mani-tasks.pdf'; a.click();
    }
  } catch (e) {}
}

// settings: check for a newer version and report it
async function checkUpd() {
  const m = $('updMsg'); m.textContent = '⏳ عم أفحص…';
  try {
    const j = await (await fetch('https://api.github.com/repos/DrOmaia/Mani/releases/latest')).json();

    $('getUpd').hidden = !lastNewer;

// ---------- family: profiles, languages, chats, ring (over ntfy.sh) ----------
const FT = {
  ar: { family:'العائلة', chats:'المحادثات', back:'‹ رجوع', settings:'⚙️', send:'إرسال', ring:'🔔 تعالي', writeHere:'اكتبي رسالة…',
    welcome:'أهلاً بكِ', whoAreYou:'مين أنتِ؟', code:'كود العائلة', codeHint:'نفس الكود لكل أفراد العائلة. إذا أنتِ أول واحد، خلّيه كما هو وانسخيه لهم.',
    start:'ابدئي', language:'اللغة', copyCode:'انسخي الكود', newCode:'كود جديد', testRing:'جرّبي الرنين', changeWho:'تغيير الاسم',

    empty:"Nta butumwa", ringSent:'Ihamagara ryoherejwe', sendFail:"Ntibyoherejwe, reba interineti", copied:'Byakoporowe',
    ringFrom:'Akurahamagaye', quick:['Ndaje','Umwanya muto','Sinshoboye','Ndakeneye ubufasha'], roles:{mom:'رند',dad:'أميه',k1:'حسان',k2:'سلمى',k3:'عبدالملك',maid:'الخادمة'},
    roleTitle:'Hitamo izina ryawe', settingsTitle:'Igenamiterere', ringBack:['Ndaje','Umwanya muto','Sinshoboye'], ringOk:'Narabyumvise' },

    start:'Start', language:'Language', copyCode:'Copy code', newCode:'New code', testRing:'Test the ring', changeWho:'Change name',
    empty:'No messages yet', ringSent:'Ring sent', sendFail:'Not sent, check the internet', copied:'Copied',
    ringFrom:'is calling you', quick:['Coming','In a moment','Cannot','I need help'], roles:{mom:'رند',dad:'أميه',k1:'حسان',k2:'سلمى',k3:'عبدالملك',maid:'الخادمة'},
    roleTitle:'Choose your name', settingsTitle:'Settings', ringBack:['Coming','In a moment','Cannot'], ringOk:'Got it' }
};
const LANG_NAMES = { ar:'العربية', rn:'Ikirundi', en:'English' };
let fam = load('fam', null);            // {me, code, lang}
let famMsgs = load('famMsgs', []);      // [{id, f, t, x, r, at, mine}]
let famRead = load('famRead', {});      // thread -> last read time
let famUi = { thread: null, settings: false };
let famES = null, ringTimer = null, ringCtx = null;
const famT = () => FT[(fam && fam.lang) || 'ar'];
const famName = r => famT().roles[r] || r;
const ROLES = ['mom','dad','k1','k2','k3','maid'];
const ROLE_ICO = { mom:'👩', dad:'👨', k1:'🧒', k2:'🧒', k3:'🧒', maid:'🧹' };
const randCode = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 30]).join('');

function famSave() { save('fam', fam); save('famMsgs', famMsgs); save('famRead', famRead); }
function famThreads() {
  const t = [{ id: 'all', name: famT().family, ico: '👨‍👩‍👧' }];
  ROLES.filter(r => r !== fam.me).forEach(r => t.push({ id: r, name: famName(r), ico: ROLE_ICO[r] }));
  return t;
}
function famThreadMsgs(th) {
  return famMsgs.filter(m => th === 'all' ? m.t === 'all' : (m.f === th && m.t === fam.me) || (m.f === fam.me && m.t === th))
    .sort((a, b) => a.at - b.at);
}
function famUnread(th) {
  const last = famRead[th] || 0;
  return famThreadMsgs(th).filter(m => !m.mine && m.at > last).length;
}

async function famSend(to, text, ring) {
  const body = JSON.stringify({ f: fam.me, t: to, x: text, r: !!ring });
  const headers = ring ? { 'X-Priority': '5', 'X-Tags': 'bell' } : {};
  const r = await fetch('https://ntfy.sh/mani-fam-' + fam.code, { method: 'POST', body, headers });
  if (!r.ok) throw new Error(r.status);
  famMsgs.push({ id: 'me' + Date.now() + Math.random(), f: fam.me, t: to, x: text, r: !!ring, at: Date.now(), mine: true });
  famSave();
}

function famConnect() {
  if (!fam || !fam.me || famES) return;
  try {
    famES = new EventSource('https://ntfy.sh/mani-fam-' + fam.code + '/sse?since=' + Math.floor(Date.now() / 1000));
    famES.onmessage = e => {
      let ev; try { ev = JSON.parse(e.data); } catch (_) { return; }
      if (ev.event !== 'message' || famMsgs.some(m => m.id === ev.id)) return;
      let m; try { m = JSON.parse(ev.message); } catch (_) { return; }
      if (!m || m.f === fam.me || (m.t !== 'all' && m.t !== fam.me)) return;
      famMsgs.push({ id: ev.id, f: m.f, t: m.t, x: m.x, r: !!m.r, at: Date.now(), mine: false });
      famSave();
      if (m.r) ringAlert(m); else if (!$('panel').hidden && panel === 'fam') renderFam();
    };
  } catch (e) {}
}

// full-screen ring: a loud tone and vibration until she answers
function ringAlert(m) {
  const ov = $('ringOv'); ov.hidden = false;
  $('rgFrom').textContent = famName(m.f) + ' ' + famT().ringFrom;
  const btns = $('rgBtns'); btns.innerHTML = famT().ringBack.map((q, i) =>
    `<button data-rq="${i}" class="${i ? 'sec' : ''}">${esc(q)}</button>`).join('') + `<button class="sec" data-rq="ok">${esc(famT().ringOk)}</button>`;
  btns.dataset.from = m.f;
  stopRing(); startRing();
}
function startRing() {
  try {
    ringCtx = ringCtx || new (window.AudioContext || window.webkitAudioContext)();
    ringTimer = setInterval(() => {
      const o = ringCtx.createOscillator(), g = ringCtx.createGain();
      o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.25;
      o.connect(g); g.connect(ringCtx.destination); o.start(); o.stop(ringCtx.currentTime + 0.35);
    }, 700);
  } catch (e) {}
  if (navigator.vibrate) ringTimer = ringTimer || setInterval(() => navigator.vibrate([400, 200, 400]), 1200);
  if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
}
function stopRing() { if (ringTimer) clearInterval(ringTimer); ringTimer = null; if (navigator.vibrate) navigator.vibrate(0); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-rq]'); if (!b) return;
  const from = $('rgBtns').dataset.from, idx = b.dataset.rq;
  stopRing(); $('ringOv').hidden = true;
  if (idx !== 'ok' && from) famSend(from, famT().ringBack[+idx], false).catch(() => {});
});

function renderFam() {
  const body = $('pBody'), foot = $('pFoot'), tools = $('pTools');
  foot.innerHTML = ''; foot.dataset.p = ''; tools.innerHTML = '';
  if (!fam || !fam.me) return famSetup(body);
  if (famUi.settings) return famSettings(body, foot);
  if (famUi.thread === null) return famList(body, foot, tools);
  return famChat(body, foot, tools);
}
function famSetup(body) {
  $('pTitle').textContent = '👨‍👩‍👧 ' + FT.ar.family;
  const lang = (fam && fam.lang) || 'ar';
  const T = FT[lang];
  const code = (fam && fam.code) || randCode();
  body.innerHTML = `<div class="fSet">
    <div><b>${esc(T.welcome)}</b></div>
    <div>${esc(T.roleTitle)}</div>
    <div class="fRoles">${ROLES.map(r => `<button data-role="${r}">${esc(T.roles[r])}</button>`).join('')}</div>
    <div>${esc(T.code)}</div>
    <input id="famCode" value="${esc(code)}" dir="ltr" autocomplete="off">
    <div class="lbl2" style="color:var(--mut);font-size:14px">${esc(T.codeHint)}</div>
    <button id="famStart" class="bar" style="background:var(--ar);color:#fff;padding:12px;border-radius:12px;font-size:18px">${esc(T.start)}</button>
  </div>`;
  body.dataset.role = '';
  $('pFoot').innerHTML = ''; $('pFoot').dataset.p = '';
  body.querySelectorAll('[data-role]').forEach(b => b.onclick = () => { body.dataset.role = b.dataset.role; body.querySelectorAll('[data-role]').forEach(x => x.classList.toggle('on', x === b)); });
  $('famStart').onclick = () => {
    const role = body.dataset.role, c = $('famCode').value.trim();
    if (!role || c.length < 6) { alert(FT[lang].roleTitle); return; }
    fam = { me: role, code: c, lang: fam && fam.lang ? fam.lang : (role === 'maid' ? 'rn' : 'ar') };
    famSave(); famConnect(); render();
  };
}
function famList(body, foot, tools) {
  $('pTitle').textContent = famT().chats;
  tools.innerHTML = `<button data-fam="settings">${famT().settings}</button>`;
  body.innerHTML = '<div class="fList">' + famThreads().map(th => {
    const ms = famThreadMsgs(th.id), last = ms[ms.length - 1], un = famUnread(th.id);
    const prev = last ? (last.r ? '🔔 ' : '') + last.x : famT().empty;
    return `<div class="fRow" data-thread="${th.id}"><div class="fAv">${th.ico}</div>
      <div class="fM"><div class="fN">${esc(th.name)}</div><div class="fP">${esc(prev)}</div></div>
      ${un ? `<span class="fBadge">${un}</span>` : ''}</div>`;
  }).join('') + '</div>';
}
function famChat(body, foot, tools) {
  const th = famThreads().find(x => x.id === famUi.thread) || famThreads()[0];
  $('pTitle').textContent = th.ico + ' ' + th.name;
  tools.innerHTML = `<button data-fam="back">${famT().back}</button>`;
  const ms = famThreadMsgs(th.id);
  body.innerHTML = '<div class="fChat">' + (ms.length ? ms.map(m => {
    const d = new Date(m.at), when = d.toLocaleTimeString(fam.lang === 'ar' ? 'ar' : 'en', { hour: '2-digit', minute: '2-digit' });
    const who = m.mine ? '' : `<b style="font-size:14px;color:var(--mut)">${esc(famName(m.f))}</b><br>`;
    return `<div class="bub ${m.mine ? 'me' : ''} ${m.r ? 'ring' : ''}">${who}${m.r ? '🔔 ' : ''}${esc(m.x)}<small>${when}${m.mine ? ' ✓' : ''}</small></div>`;
  }).join('') : `<div class="empty">${esc(famT().empty)}</div>`) + '</div>';
  setTimeout(() => body.scrollTop = body.scrollHeight, 0);
  foot.dataset.p = 'chat-' + th.id;
  foot.innerHTML = `<div style="width:100%"><div class="fQuick">${famT().quick.map((q, i) => `<button data-fq="${i}">${esc(q)}</button>`).join('')}</div>
    <div class="fIn"><button class="rb" data-fam="ring" aria-label="ring">🔔</button><input id="famTxt" placeholder="${esc(famT().writeHere)}"><button data-fam="send" aria-label="send">➜</button></div></div>`;
  famRead[th.id] = Date.now(); save('famRead', famRead);
}
function famSettings(body, foot) {
  $('pTitle').textContent = famT().settingsTitle;
  const T = famT();
  body.innerHTML = `<div class="fSet">
    <div>${esc(T.language)}</div>
    ${['ar','rn','en'].map(l => `<button class="set ${fam.lang === l ? 'on' : ''}" data-flang="${l}"><span>${LANG_NAMES[l]}</span><span>${fam.lang === l ? '✓' : ''}</span></button>`).join('')}
    <button class="set" data-fam="copy"><span>${esc(T.copyCode)}</span><span dir="ltr">${esc(fam.code)}</span></button>
    <button class="set" data-fam="ringtest"><span>${esc(T.testRing)}</span><span>🔔</span></button>
    <button class="set" data-fam="who"><span>${esc(T.changeWho)}</span><span>${esc(T.roles[fam.me])}</span></button>
  </div>`;
  famUi.settings = true;
}

document.addEventListener('click', e => {
  if (!$('panel').hidden && panel === 'fam') {
    const row = e.target.closest('[data-thread]');
    if (row) { famUi.thread = row.dataset.thread; return render(); }
    const fq = e.target.closest('[data-fq]');
    if (fq) return famSendTo(famT().quick[+fq.dataset.fq]);
    const fl = e.target.closest('[data-flang]');
    if (fl) { fam.lang = fl.dataset.flang; famSave(); return render(); }
    const fa = e.target.closest('[data-fam]');
    if (!fa) return;
    const a = fa.dataset.fam;
    if (a === 'settings') { famUi.settings = true; return render(); }
    if (a === 'back') { famUi.settings = false; famUi.thread = null; return render(); }
    if (a === 'send') return famSendTo($('famTxt').value.trim());
    if (a === 'ring') return famRing();
    if (a === 'ringtest') { startRing(); setTimeout(stopRing, 2500); return; }
    if (a === 'copy') { try { navigator.clipboard.writeText(fam.code); } catch (_) {} return; }
    if (a === 'who') { fam = null; famES && famES.close(); famES = null; famUi = { thread: null, settings: false }; famSave(); return render(); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'famTxt') famSendTo(e.target.value.trim()); });
async function famSendTo(text) {
  if (!text || !fam) return;
  const to = famUi.thread || 'all';
  try { await famSend(to, text, false); } catch (e) { alert(famT().sendFail); return; }
  $('famTxt') && ($('famTxt').value = ''); renderFam();
}
async function famRing() {
  if (!fam) return;
  const to = famUi.thread || 'all';
  try { await famSend(to, '🔔', true); alert(famT().ringSent); } catch (e) { alert(famT().sendFail); }
  renderFam();
}
famConnect();

// ---------- hardware Back button: close the open panel first ----------
if (P.App) P.App.addListener('backButton', () => { if (panel) closePanel(); else P.App.exitApp(); });

// ---------- updates ----------
const APK_URL = 'https://github.com/DrOmaia/Mani/releases/latest/download/Mani.apk';
(async () => {
  // the update file of the last update is not needed once the app has started again: remove it
  try { if (P.Filesystem) await P.Filesystem.deleteFile({ path: 'Mani.apk', directory: 'CACHE' }); } catch (e) {}
  try {
    const r = await fetch('https://api.github.com/repos/DrOmaia/Mani/releases/latest');
    const n = parseInt(((await r.json()).tag_name || '').replace('v', ''), 10);
    if (window.MANI_VERSION && n > window.MANI_VERSION) $('upd').hidden = false;
  } catch (e) {}
})();
// download into the app's own cache (not Downloads), then open the installer
async function update(ev) {
  if (!P.Filesystem || !P.FileOpener) return;   // no plugins: the link opens in the browser
  if (ev) ev.preventDefault();
  const a = $('upd'); a.hidden = false;
  a.textContent = '⏳ عم ينزّل التحديث…';
  let f;
  try {
    f = await P.Filesystem.downloadFile({ url: APK_URL, path: 'Mani.apk', directory: 'CACHE' });
  } catch (e) { a.textContent = '⚠️ التحديث ما نزل (ما في إنترنت؟)، اضغطي لتجرّبي مرة ثانية'; return; }
  try {
    await P.FileOpener.open({ filePath: f.path, contentType: 'application/vnd.android.package-archive' });
    a.textContent = '⬇️ في نسخة جديدة من التطبيق، اضغطي للتحديث';
  } catch (e) {
    a.textContent = '⚠️ التحديث نزل، بس ما فتح المثبّت. إذا طلب إذن «تثبيت من مصادر غير معروفة» وافقي، وبعدين اضغطي هون مرة ثانية';
  }
}
